name: Build Swift SDK for Emscripten

on:
  schedule:
    # Daily, after swift.org usually publishes a new snapshot.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot tag (empty: latest), e.g. swift-DEVELOPMENT-SNAPSHOT-2026-10-17-a"
        required: false
      force:
        description: "Rebuild even if a release for this snapshot exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.snapshot.outputs.tag }}
      build: ${{ steps.snapshot.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SNAPSHOT: ${{ inputs.snapshot }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          tag="${INPUT_SNAPSHOT:-$(scripts/latest-snapshot.sh)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$INPUT_FORCE" != "true" ]] && gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3 binutils libc6-dev libgcc-13-dev \
            libstdc++-13-dev libcurl4-openssl-dev libedit2 libsqlite3-0 \
            libxml2-dev libncurses-dev libpython3-dev pkg-config tzdata \
            zlib1g-dev

      - name: Build
        run: scripts/build.sh "$TAG" "$RUNNER_TEMP/work"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/work/dist"
          name="${TAG}_wasm-emscripten.artifactbundle.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
          checksum="$(cut -d' ' -f1 "$dist/$name.sha256")"
          emscripten="$(cat "$dist/emscripten-version.txt")"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Unofficial Swift SDK for \`wasm32-unknown-emscripten\`, built from
          [\`$TAG\`](https://github.com/swiftlang/swift/releases/tag/$TAG)
          with Emscripten $emscripten.

          Use it with the toolchain from the same snapshot
          ([macOS](https://download.swift.org/development/xcode/$TAG/$TAG-osx.pkg)).

          \`\`\`
          swift sdk install $url --checksum $checksum
          \`\`\`
          EOF
          gh release delete "$TAG" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$dist/$name" "$dist/$name.sha256"
